:root{--ink:#26302e;--paper:#fdf9f0;--card:#ffffff;--teal:#0f766e;--teal-soft:#d9efec;--amber:#b45309;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{padding:12px 14px 8px;background:var(--paper);border-bottom:1px solid #e8e0d0}
header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--teal)}
header form{display:flex;gap:8px;margin-top:8px}
header input{flex:1;font-size:16px;padding:10px 12px;border:1.5px solid #d8cfbc;border-radius:12px;background:#fff;color:var(--ink)}
header input:focus{outline:none;border-color:var(--teal)}
header button{font-size:16px;font-weight:700;padding:10px 18px;border:none;border-radius:12px;background:var(--teal);color:#fff}
#status{font-size:13px;color:#6b6455;margin-top:7px;min-height:16px}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#listBtn{position:absolute;right:12px;top:12px;z-index:600;font-size:14px;font-weight:700;padding:9px 14px;border:none;border-radius:20px;background:#fff;color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.18)}
#listPanel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:590;background:var(--paper);overflow-y:auto;display:none;padding:12px}
#listPanel.show{display:block}
#listPanel h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#6b6455;margin:4px 4px 10px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid #eee5d4;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:15px}
.row b{display:block;font-size:16px}
.row small{color:#6b6455}
#detail{position:absolute;left:0;right:0;bottom:0;z-index:700;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s ease;max-height:72%;overflow-y:auto}
#detail.show{transform:translateY(0)}
#detail .close{position:absolute;right:12px;top:10px;border:none;background:var(--teal-soft);color:var(--teal);width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:700}
#detail h2{font-size:20px;font-weight:800;padding-right:36px}
#detail .op{color:var(--teal);font-weight:600;font-size:14px;margin-top:2px}
#detail p{font-size:14.5px;margin-top:8px;color:#41473f}
#detail .btnrow{display:flex;gap:8px;margin-top:10px}
#detail .dirbtn{display:inline-block;background:var(--teal);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;text-decoration:none}
#detail h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#6b6455;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:8px 13px;border-radius:999px;border:1.5px solid #d8cfbc;background:#fff;color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:var(--amber)}
footer{font-size:11px;color:#8a8271;padding:6px 14px calc(6px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid #e8e0d0}
footer a{color:var(--teal)}

.rev{background:var(--paper);border:1px solid #eee5d4;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.rev .stars{color:var(--amber);font-size:13px;font-weight:700}
.rev small{color:#6b6455;display:block;margin-top:3px}
.revform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.starbtns{display:flex;gap:4px}
.starbtns button{font-size:22px;background:none;border:none;color:#d8cfbc;cursor:pointer;padding:0 2px}
.starbtns button.on{color:var(--amber)}
.revform textarea,.revform input{font-size:15px;padding:9px 11px;border:1.5px solid #d8cfbc;border-radius:10px;background:#fff;font-family:inherit;width:100%}
.revform .post{font-size:15px;font-weight:700;padding:10px;border:none;border-radius:10px;background:var(--teal);color:#fff}
.closed{color:var(--amber);font-weight:600}
#detail small{color:#6b6455}
#searchForm button.busy{opacity:.55}
</style>

function bakedTown(q){ const b = BAKED_TOWNS[q.toLowerCase().trim()]; return (b && b.shops.length) ? b : null; }
async function searchTown(q){
  const b = bakedTown(q);
  if (b) { showShops(b.shops, b.center, q); status(q + ' — ' + b.shops.length + ' shops'); return; }
  const btn = document.querySelector('#searchForm button');
  const busy = on => { btn.disabled = on; btn.classList.toggle('busy', on); btn.textContent = on ? 'Finding…' : 'Find'; };
  const key = 'csf-town:' + q.toLowerCase();
  try { const c = JSON.parse(localStorage.getItem(key) || 'null');
    if (c && c.shops) { showShops(c.shops, c.center, q); status(q + ' — ' + c.shops.length + ' shops'); return; } } catch(e) {}
  busy(true);
  let shown = false;
  try {
    status('finding ' + q + '…');
    const geoKey = 'csf-geo:' + q.toLowerCase();
    let geo = null;
    try { geo = JSON.parse(localStorage.getItem(geoKey) || 'null'); } catch(e) {}
    if (!geo || !geo.length) {
      try { geo = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=' + encodeURIComponent(q)).then(r => r.json()); }
      catch(e) { status('couldn\'t reach the map data — check your connection'); return; }
      if (geo && geo.length) { try { localStorage.setItem(geoKey, JSON.stringify(geo)); } catch(e) {} }
    }
    if (!geo || !geo.length) { status('couldn\'t find "' + q + '" — try the full town name'); return; }
    const bb = geo[0].boundingbox; // [south, north, west, east]
    const bbox = bb[0] + ',' + bb[2] + ',' + bb[1] + ',' + bb[3];
    const center = [+geo[0].lat, +geo[0].lon];
    // show the saved copy right away so there is something on screen while the live search runs
    const fallback = inBbox(bb);

    else status('searching for charity shops…');
    const query = '[out:json][timeout:25];(nwr["shop"="charity"](' + bbox + ');nwr["shop"="second_hand"]["second_hand"~"charity",i](' + bbox + ');nwr["shop"="second_hand"]["operator"~"charity|hospice|oxfam|bhf|age uk|cancer|salvation|st margaret",i](' + bbox + '););out center tags;';
    let res = null;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    for (const url of ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter']) {
      try { res = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(query), signal: ctrl.signal}).then(r => r.json()); break; } catch(e) {}
    }
    clearTimeout(timer);
    const els = res ? (res.elements || []).map(e => {
      const t = e.tags || {};
      return { id: e.type[0] + e.id, name: t.name || '(unnamed shop)', operator: t.operator || '', hours: t.opening_hours || '',
        addr: [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' '), city: t['addr:city'] || '', postcode: t['addr:postcode'] || '',
        phone: t.phone || '', website: t.website || '', lat: (e.lat !== undefined ? e.lat : (e.center || {}).lat), lon: (e.lon !== undefined ? e.lon : (e.center || {}).lon) };
    }).filter(e => e.lat !== undefined) : [];

    }

}
